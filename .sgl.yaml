name: repo
# This repo's own gates. CI runs them through the GitHub Action, and they
# work as a Claude Code Stop hook while developing: sgl hook claude-code .sgl.yaml

stages:
  - name: preflight
    gates:
      - name: tools
        run: sgl gate preflight --cmd python3 --cmd git --cmd gitleaks --cmd bandit

  - name: security
    gates:
      - name: no-secrets-in-history
        run: gitleaks git . --no-banner --redact
      - name: static-analysis
        # --severity-level medium: fail on medium or high. Low findings are
        # expected in a tool whose whole job is running commands, and the two
        # real findings (B602 shell, B310 urlopen) are suppressed in source with
        # a written reason, not hidden by the threshold.
        run: bandit -r src --severity-level medium -q

  - name: code
    gates:
      - name: compiles
        run: python3 -m compileall -q src bench
      - name: tests
        run: python3 -m unittest discover -s tests -q

  - name: docs
    gates:
      - name: no-em-dash-in-docs
        run: sgl gate no-pattern README.md SECURITY.md docs/how-it-works.md bench/README.md adapters/claude-code/README.md adapters/github-action/README.md -p "\u2014"
      - name: images-match-their-script
        # The SVGs are generated. If someone edits a label in build.py and
        # forgets to re-run it, the README shows a stale picture. This catches it.
        run: >-
          python3 assets/build.py >/dev/null &&
          test -z "$(git status --porcelain -- assets)" ||
          (echo "assets changed but are not committed: run python3 assets/build.py, then commit the result"; git status --short -- assets; exit 1)
