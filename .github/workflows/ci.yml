name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      # Third-party actions are pinned to a full commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: examples run end to end
        run: |
          for ex in blog-publish code-pr cron-report; do
            (cd examples/$ex && sgl run pipeline.yaml)
          done
      - name: cron-report stops on bad upstream data
        run: |
          cd examples/cron-report && rm -rf out .sgl
          if BREAK=1 sgl run pipeline.yaml; then echo "expected the schema gate to stop the line"; exit 1; fi
      - name: benchmark sim is reproducible
        run: python bench/bench.py sim

  # The repo dogfoods itself: its own CI is an sgl pipeline.
  self-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/ && rm "$f"
      - name: install bandit
        run: pip install "bandit==1.8.6"
      # Local action (this repo). Inputs are passed via env inside action.yml,
      # never interpolated into shell, so no injection path.
      - uses: ./
        with:
          pipeline: .sgl.yaml
          version: ${{ github.sha }}
