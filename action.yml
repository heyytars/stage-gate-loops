name: "Stage gate loops"
description: "Run an sgl pipeline. The job fails at the first failed gate, and the breakpoint shows in the job summary."
branding:
  icon: "git-commit"
  color: "green"
inputs:
  pipeline:
    description: "Path to the pipeline YAML"
    required: true
  gates-only:
    description: "Only check gates, skip stage commands (use this to gate an agent's PR)"
    required: false
    default: "false"
  version:
    description: "sgl git ref to install"
    required: false
    default: "main"
outputs:
  ok:
    description: "true if every gate passed"
    value: ${{ steps.run.outputs.ok }}
  stopped-at:
    description: "Name of the stage that stopped the line"
    value: ${{ steps.run.outputs.stopped_at }}
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        SGL_VERSION: ${{ inputs.version }}
      run: pip install --quiet "git+https://github.com/heyytars/stage-gate-loops@${SGL_VERSION}"
    - id: run
      shell: bash
      env:
        SGL_PIPELINE: ${{ inputs.pipeline }}
        SGL_GATES_ONLY: ${{ inputs.gates-only }}
      run: |
        flags=""
        [ "$SGL_GATES_ONLY" = "true" ] && flags="--gates-only"
        # result goes to the runner's temp dir, never the workspace, so a
        # later step can't commit or upload it by accident
        result="${RUNNER_TEMP}/sgl-result.json"
        set +e
        sgl run "$SGL_PIPELINE" $flags --json > "$result"
        code=$?
        set -e
        SGL_RESULT="$result" python3 - <<'PY'
        import json, os, re
        try:
            r = json.load(open(os.environ["SGL_RESULT"]))
        except (OSError, ValueError):
            r = {"ok": False, "stopped_at": "(sgl error)", "passed": [], "feedback": "sgl did not produce a result; see the step log"}
        clean = lambda s: re.sub(r"[\r\n]", " ", str(s or ""))  # one line, so outputs can't be forged
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"ok={'true' if r['ok'] else 'false'}\n")
            f.write(f"stopped_at={clean(r['stopped_at'])}\n")
        # Gate output is already redacted by sgl. The fence is longer than any
        # backtick run inside it, so output can't break out of the code block.
        fb = r["feedback"][-6000:]
        fence = "`" * max(3, max((len(m) for m in re.findall(r"`+", fb)), default=0) + 1)
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            if r["ok"]:
                f.write("### ✅ All stage gates passed\n\n" + ", ".join(map(clean, r["passed"])) + "\n")
            else:
                f.write(f"### 🛑 Stopped at `{clean(r['stopped_at'])}`\n\n")
                f.write(f"Passed: {', '.join(map(clean, r['passed'])) or 'none'}\n\n")
                f.write(f"{fence}\n{fb}\n{fence}\n")
        PY
        exit $code
