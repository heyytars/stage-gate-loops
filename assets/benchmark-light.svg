<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500"
  role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">Benchmark: tokens per successful run</title><desc id="d">Modelled over 20,000 seeded trials of the same four-stage pipeline</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1040" height="500" rx="12" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="1038.5" height="498.5" rx="11" fill="none"
        stroke="#d1d9e0" stroke-width="1.5"/>
<text x="40" y="66" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">Same pipeline, same failure rate, two strategies</text><text x="40" y="92" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">Model: 4 stages x 3,000 tokens, 25% chance a stage fails per attempt, 3 attempts</text><text x="40" y="174" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">End-of-run check</text><text x="40" y="198" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">67.9% of runs finished</text><rect x="360" y="140" width="300" height="90" rx="7" fill="#eff2f5" stroke="#d1d9e0" stroke-width="1"/><rect x="360" y="140" width="259" height="90" rx="7" fill="#cf222e" opacity="0.18"/><rect x="360" y="140" width="259.27" height="90" rx="7" fill="none" stroke="#cf222e" stroke-width="1.6"/><text x="680" y="186" font-size="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#cf222e" font-weight="700">25,927</text><text x="680" y="208" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">tokens</text><text x="40" y="304" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">Stage gates</text><text x="40" y="328" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">93.8% of runs finished</text><rect x="360" y="270" width="300" height="90" rx="7" fill="#eff2f5" stroke="#d1d9e0" stroke-width="1"/><rect x="360" y="270" width="154" height="90" rx="7" fill="#1a7f37" opacity="0.18"/><rect x="360" y="270" width="153.94" height="90" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.6"/><text x="680" y="316" font-size="22" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#1a7f37" font-weight="700">15,394</text><text x="680" y="338" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">tokens</text><rect x="40" y="406" width="960" height="64" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="64" y="432" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">Stage gates used 59% of the tokens and finished far more often.</text><text x="64" y="452" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#59636e" font-weight="400">Modelled control-flow numbers, not a model measurement. See bench/README.md.</text></svg>
