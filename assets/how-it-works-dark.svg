<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400"
  role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">One gate, up close</title><desc id="d">A stage runs, a gate checks the result. Exit 0 moves on to the next stage. Anything else sends the error back to the same stage, which tries again.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#21262d"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="20" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="398" rx="20" fill="url(#dots)"/>
<text x="64" y="60" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#9198a1" font-weight="700" letter-spacing="1.5" xml:space="preserve" style="white-space:pre">ONE GATE, UP CLOSE</text><path d="M310 228H558" stroke="#9198a1" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" marker-end="url(#am)"/><path d="M710 228H958" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ag)"/><rect x="797.6" y="188.5" width="72.8" height="27" rx="13.5" fill="#3fb950" stroke="#3fb950" stroke-width="1.5"/><text x="834.0" y="206.68" font-size="13" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve" style="white-space:pre">exit 0</text><path d="M616 162 C616 70, 264 70, 264 160" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="345.1" y="74.5" width="189.8" height="27" rx="13.5" fill="#f85149" stroke="#f85149" stroke-width="1.5"/><text x="440.0" y="92.68" font-size="13" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve" style="white-space:pre">fail: error goes back</text><rect x="180.0" y="168.0" width="120" height="120" rx="31" fill="#0d1117" filter="url(#sh)"/><rect x="180.0" y="168.0" width="120" height="120" rx="31" fill="#ab7df8" fill-opacity="0.09" stroke="#ab7df8" stroke-opacity="0.35" stroke-width="1.5"/><g transform="translate(214.8,202.8) scale(2.1000)" fill="none" stroke="#ab7df8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3.5"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1.2"/><path d="M9.5 13.5v1.5M14.5 13.5v1.5"/></g><text x="240" y="324" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#f0f6fc" font-weight="700" text-anchor="middle" xml:space="preserve" style="white-space:pre">stage runs</text><text x="240" y="348" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#9198a1" font-weight="400" text-anchor="middle" xml:space="preserve" style="white-space:pre">agent, script or job</text><circle cx="640" cy="228" r="62" fill="#0d1117" filter="url(#sh)"/><circle cx="640" cy="228" r="62" fill="#4493f8" fill-opacity="0.09" stroke="#4493f8" stroke-opacity="0.5" stroke-width="1.8"/><g transform="translate(614.0,202.0) scale(2.1667)" fill="none" stroke="#4493f8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M7.5 10l3 2.5-3 2.5M13 15.5h4"/></g><text x="640" y="324" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#f0f6fc" font-weight="700" text-anchor="middle" xml:space="preserve" style="white-space:pre">gate checks</text><text x="640" y="348" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#9198a1" font-weight="400" text-anchor="middle" xml:space="preserve" style="white-space:pre">tests · schema · lint · any command</text><rect x="980.0" y="168.0" width="120" height="120" rx="31" fill="#0d1117" filter="url(#sh)"/><rect x="980.0" y="168.0" width="120" height="120" rx="31" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.9" stroke-width="2"/><g transform="translate(1014.8,202.8) scale(2.1000)" fill="none" stroke="#3fb950" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g><text x="1040" y="324" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#f0f6fc" font-weight="700" text-anchor="middle" xml:space="preserve" style="white-space:pre">next stage</text><text x="1040" y="348" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#9198a1" font-weight="400" text-anchor="middle" xml:space="preserve" style="white-space:pre">only after a pass</text></svg>
